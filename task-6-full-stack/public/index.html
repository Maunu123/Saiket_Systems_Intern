<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>People / User management</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Space+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body><main class="layout"><aside><p class="brand">people<span>_</span></p><p class="eyebrow">Workspace / 2024</p><h1>Keep the<br><em>human</em><br>in the data.</h1><p class="aside-copy">A simple directory for the people who make the work happen.</p><div class="aside-footer">Connected to PostgreSQL<br>CRUD interface online</div></aside><section class="content"><header><div><p class="eyebrow">User management</p><h2>Team directory</h2></div><button id="newUserButton" class="dark-button">+ New profile</button></header><div id="notice" role="status"></div><section id="formPanel" class="form-panel hidden"><div class="panel-heading"><h3 id="formTitle">New profile</h3><button id="closeForm" class="icon-button" aria-label="Close form">×</button></div><form id="profileForm"><input type="hidden" id="profileId"><label>Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><div class="form-row"><label>Age<input id="age" type="number" min="0" required></label><label>Role<input id="role" value="Member" required></label></div><button class="dark-button" type="submit">Save profile <span>↗</span></button></form></section><div class="directory-head"><span id="profileCount">0 profiles</span><span>Last updated just now</span></div><div id="profileList" class="profile-list"></div></section></main><script src="app.js"></script></body></html>
